[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posfoxgen"
version = "0.1.0"
description = "Harness-operated scientific poster workflow with local evidence tools"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24", "Pillow>=10"]

[project.scripts]
posfoxgen = "posfoxgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
text-repair = ["playwright>=1.40", "matplotlib>=3.8"]
